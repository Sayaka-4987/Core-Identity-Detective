<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core Identity Detective</title>
    <style>
      :root {
        --bg: #061123;
        --bg-soft: #0b1a33;
        --panel: rgba(11, 23, 43, 0.74);
        --panel-2: rgba(27, 43, 74, 0.5);
        --border: rgba(146, 182, 255, 0.24);
        --text: #e6edf7;
        --muted: #a8bbd7;
        --accent: #62b0ff;
        --accent-2: #82e7d3;
        --green: #46d88a;
        --yellow: #f2c367;
        --red: #ff7270;
        --gray: #96a7bf;
        --mono:
          Consolas, "Cascadia Mono", "SF Mono", Menlo, Monaco,
          "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(
            1200px 700px at 18% -10%,
            rgba(98, 176, 255, 0.18),
            transparent 56%
          ),
          radial-gradient(
            900px 520px at 90% 0%,
            rgba(130, 231, 211, 0.16),
            transparent 58%
          ),
          linear-gradient(145deg, #050d1c 0%, var(--bg) 52%, #071631 100%);
        color: var(--text);
        font-family: var(--mono);
        line-height: 1.55;
        min-height: 100vh;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(
            to right,
            rgba(128, 164, 224, 0.08) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(128, 164, 224, 0.08) 1px,
            transparent 1px
          );
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, black 32%, transparent 88%);
        pointer-events: none;
        opacity: 0.24;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 30px 16px 64px;
        position: relative;
        z-index: 1;
      }
      header.bar {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }
      .brand {
        font-family: var(--mono);
        font-weight: 700;
        font-size: clamp(28px, 4.8vw, 42px);
        line-height: 1.1;
        letter-spacing: 0.04em;
        color: var(--accent);
        text-shadow: 0 0 26px rgba(98, 176, 255, 0.32);
      }
      .lang-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        font-size: 14px;
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 20;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(8, 18, 35, 0.92);
        box-shadow: 0 10px 26px rgba(2, 8, 20, 0.4);
      }
      .lang-toggle button {
        background: transparent;
        border: 1px solid transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 1em;
        padding: 0.42em 0.86em;
        min-width: 66px;
        border-radius: 999px;
        transition: all 150ms ease;
        touch-action: manipulation;
      }
      .lang-toggle button.active {
        color: var(--text);
        font-weight: 700;
        border-color: rgba(98, 176, 255, 0.55);
        background: rgba(98, 176, 255, 0.14);
      }
      .lang-toggle span {
        color: rgba(168, 187, 215, 0.42);
        font-size: 1em;
      }

      .lang-hero {
        margin: 0 0 22px;
        padding: 15px 16px 16px;
        border-radius: 13px;
        border: 1px solid rgba(130, 231, 211, 0.38);
        background:
          linear-gradient(
            140deg,
            rgba(130, 231, 211, 0.16),
            rgba(98, 176, 255, 0.1)
          ),
          rgba(8, 19, 37, 0.7);
      }
      .lang-hero-title {
        margin: 0;
        font-size: clamp(20px, 3.6vw, 26px);
        font-weight: 700;
        line-height: 1.25;
      }
      .lang-hero-sub {
        margin: 6px 0 0;
        color: var(--muted);
      }

      #screen-case,
      #screen-result,
      #screen-end {
        font-size: 17px;
      }
      #case-title {
        font-size: 26px;
      }
      #screen-case .telemetry {
        font-size: 15px;
      }
      #screen-case .section-title,
      #screen-case .confidence-label {
        font-size: 14px;
      }

      body.mode-home .lang-toggle {
        display: none;
      }

      .card {
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.03),
            rgba(255, 255, 255, 0) 32%
          ),
          var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 26px;
        box-shadow:
          0 12px 36px rgba(2, 8, 20, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(6px);
        animation: rise-in 280ms ease-out both;
      }
      h1 {
        font-size: clamp(27px, 4vw, 34px);
        margin: 0 0 8px;
        letter-spacing: 0.03em;
      }
      .tagline {
        color: var(--muted);
        margin: 0 0 28px;
      }
      .how-to-play {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        margin: -16px 0 28px;
        padding: 12px 14px;
        border-left: 3px solid rgba(102, 183, 255, 0.55);
        background: rgba(102, 183, 255, 0.08);
        border-radius: 8px;
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 18px;
      }

      button.primary {
        background: linear-gradient(135deg, #66b7ff 0%, #4ca2f6 100%);
        color: #031122;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 10px;
        padding: 11px 18px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(56, 145, 236, 0.34);
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
        touch-action: manipulation;
      }
      button.primary:active {
        transform: translateY(0);
      }
      button.primary:disabled {
        background: rgba(79, 97, 128, 0.5);
        color: var(--muted);
        box-shadow: none;
        border-color: transparent;
        cursor: not-allowed;
      }
      button.ghost {
        background: rgba(130, 231, 211, 0.05);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 11px 18px;
        font-size: 15px;
        cursor: pointer;
        transition: border-color 140ms ease, background 140ms ease,
          transform 120ms ease;
        touch-action: manipulation;
      }
      .btn-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .section-title {
        font-family: var(--mono);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin: 22px 0 10px;
      }

      .telemetry {
        font-family: var(--mono);
        font-size: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tele-row {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid rgba(168, 187, 215, 0.16);
        max-width: 100%;
      }
      .tele-key {
        color: var(--muted);
      }
      .tele-val {
        font-weight: 600;
      }
      .status-normal {
        color: var(--green);
      }
      .status-warning {
        color: var(--yellow);
      }
      .status-alarming {
        color: var(--red);
      }
      .status-unknown {
        color: var(--gray);
      }

      .choices {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .choice {
        display: block;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 13px;
        margin-bottom: 8px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.01);
        transition: border-color 120ms ease, background 120ms ease,
          transform 120ms ease;
        touch-action: manipulation;
      }
      .choice input {
        margin-right: 10px;
      }
      .choice.selected {
        border-color: var(--accent);
        background: rgba(98, 176, 255, 0.13);
        box-shadow: inset 0 0 0 1px rgba(98, 176, 255, 0.24);
      }

      .confidence-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 6px 0 4px;
      }
      .confidence-row input[type="range"] {
        flex: 1;
      }
      .confidence-val {
        font-family: var(--mono);
        min-width: 48px;
        text-align: right;
      }
      .confidence-label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 18px;
      }

      .verdict {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      .verdict.correct {
        color: var(--green);
      }
      .verdict.wrong {
        color: var(--red);
      }
      .result-line {
        margin: 4px 0;
      }
      .score-delta {
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 700;
        margin: 14px 0 4px;
      }
      .total-score {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 14px;
      }
      .explanation {
        background: var(--panel-2);
        border-radius: 12px;
        border: 1px solid rgba(168, 187, 215, 0.14);
        padding: 12px 14px;
        margin: 14px 0;
      }
      .flavor {
        color: var(--muted);
        font-style: italic;
        margin: 8px 0 0;
      }

      .fy-review {
        background: var(--panel-2);
        border-radius: 12px;
        border: 1px solid rgba(168, 187, 215, 0.14);
        padding: 14px 16px;
        margin: 18px 0;
        text-align: left;
      }
      .fy-review h2 {
        font-family: var(--mono);
        font-size: 15px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0 0 10px;
        color: var(--green);
      }
      .fy-stat {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 13px;
        padding: 3px 0;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      }
      .fy-stat .fy-key {
        color: var(--muted);
      }
      .fy-verdict {
        margin: 12px 0 0;
        font-style: italic;
        line-height: 1.45;
      }
      #contribution a,
      #contribution a:visited {
        color: var(--accent);
        text-decoration-color: rgba(88, 166, 255, 0.55);
        text-underline-offset: 3px;
      }
      #contribution a:hover,
      #contribution a:focus-visible {
        color: #8ec5ff;
        text-decoration-color: rgba(142, 197, 255, 0.9);
      }

      .achievements {
        text-align: left;
        margin: 18px 0;
      }
      .achievements h2 {
        font-family: var(--mono);
        font-size: 15px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0 0 8px;
        color: var(--yellow);
      }
      .ach-sub {
        color: var(--muted);
        font-size: 12px;
        margin: 0 0 8px;
        font-family: var(--mono);
      }
      .ach-item {
        background: var(--panel-2);
        border-left: 3px solid var(--yellow);
        border-radius: 8px;
        border: 1px solid rgba(168, 187, 215, 0.14);
        padding: 8px 12px;
        margin: 6px 0;
      }
      .ach-item.locked {
        border-left-color: rgba(255, 255, 255, 0.12);
        opacity: 0.55;
      }
      .ach-name {
        font-weight: 700;
        font-size: 14px;
      }
      .ach-desc {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 600px) {
        .wrap {
          padding: 18px 12px 48px;
        }
        .card {
          padding: 19px 16px;
          border-radius: 15px;
        }
        h1 {
          font-size: 24px;
        }
        .verdict {
          font-size: 20px;
        }
        header.bar {
          margin-bottom: 14px;
        }
        .brand {
          font-size: clamp(24px, 7vw, 32px);
        }
        .telemetry {
          font-size: 13px;
        }
        button.primary,
        button.ghost {
          padding: 10px 16px;
          flex: 1 1 auto;
        }
        .btn-row {
          gap: 8px;
        }
        .lang-toggle {
          top: 10px;
          right: 10px;
          gap: 6px;
          font-size: 13px;
          padding: 7px 8px;
        }
        .lang-toggle button {
          min-width: 60px;
          padding: 0.44em 0.72em;
        }
        .lang-hero {
          margin-bottom: 18px;
          padding: 13px 13px 14px;
        }
        #screen-case,
        #screen-result,
        #screen-end {
          font-size: 16px;
        }
        #case-title {
          font-size: 24px;
        }
        #screen-case .telemetry {
          font-size: 14px;
        }
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.995);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        button.primary,
        button.ghost,
        .choice {
          animation: none;
          transition: none;
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .lang-toggle button:hover {
          color: var(--text);
          border-color: rgba(130, 231, 211, 0.4);
          background: rgba(130, 231, 211, 0.08);
        }
        button.primary:hover {
          transform: translateY(-1px);
          box-shadow: 0 12px 26px rgba(56, 145, 236, 0.45);
        }
        button.ghost:hover {
          border-color: rgba(130, 231, 211, 0.52);
          background: rgba(130, 231, 211, 0.1);
          transform: translateY(-1px);
        }
        .choice:hover {
          border-color: rgba(130, 231, 211, 0.5);
          background: rgba(130, 231, 211, 0.07);
          transform: translateY(-1px);
        }
      }

      .tele-key,
      .tele-val,
      .choice,
      .explanation,
      .fy-stat {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .fy-stat {
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="bar">
        <span class="brand">Core Identity Detective</span>
        <div class="lang-toggle">
          <span class="meta-lang" data-lang="label"></span>
          <button id="lang-en">EN</button>
          <span>|</span>
          <button id="lang-zh">中文</button>
        </div>
      </header>

      <!-- HOME -->
      <section id="screen-home" class="card">
        <h1 id="home-title"></h1>
        <p class="tagline" id="home-tagline"></p>
        <p class="how-to-play" id="home-howto"></p>
        <div class="lang-hero" id="lang-hero">
          <p class="lang-hero-title" id="home-lang-title"></p>
          <p class="lang-hero-sub" id="home-lang-hint"></p>
        </div>
        <div class="btn-row">
          <button class="primary" id="btn-start"></button>
          <button class="ghost" id="btn-home-switch"></button>
          <button class="ghost hidden" id="btn-continue"></button>
        </div>
      </section>

      <!-- CASE -->
      <section id="screen-case" class="card hidden">
        <p class="meta" id="case-meta"></p>
        <h1 id="case-title"></h1>
        <p id="case-intro"></p>

        <div class="section-title" id="label-telemetry"></div>
        <div class="telemetry" id="telemetry"></div>

        <div class="section-title" id="label-question"></div>
        <ul class="choices" id="choices"></ul>

        <div class="section-title" id="label-confidence"></div>
        <div class="confidence-row">
          <input
            type="range"
            id="confidence"
            min="0"
            max="100"
            step="5"
            value="50"
          />
          <span class="confidence-val" id="confidence-val">50%</span>
        </div>
        <div class="confidence-label" id="confidence-label"></div>

        <div class="btn-row">
          <button class="primary" id="btn-submit" disabled></button>
        </div>
      </section>

      <!-- RESULT -->
      <section id="screen-result" class="card hidden">
        <p class="verdict" id="verdict"></p>
        <div id="result-lines"></div>
        <div class="explanation" id="explanation"></div>
        <p class="flavor" id="result-flavor"></p>
        <div class="score-delta" id="score-delta"></div>
        <div class="total-score" id="total-score"></div>
        <div class="btn-row">
          <button class="primary" id="btn-next"></button>
        </div>
      </section>

      <!-- END OF RUN -->
      <section id="screen-end" class="card hidden">
        <h1 id="end-title"></h1>
        <p id="end-flavor" class="tagline"></p>
        <div class="score-delta" id="end-score"></div>

        <!-- Fiscal Year performance review (computed from this run's log). -->
        <div id="fy-review" class="fy-review"></div>

        <!-- Achievements unlocked (cumulative across runs). -->
        <div id="achievements-block" class="achievements"></div>

        <!-- Shown only when every case has been played (case bank exhausted). -->
        <div id="contribution" class="fy-review hidden"></div>

        <div class="btn-row">
          <button class="primary" id="btn-next-fy"></button>
          <button class="primary" id="btn-home"></button>
          <button class="ghost" id="btn-share"></button>
          <button class="ghost hidden" id="btn-reset"></button>
        </div>
        <p class="flavor" id="share-feedback"></p>
      </section>
    </div>

    <!-- Case content lives in cases.js so it can grow toward 20 cases
         (one Fiscal Year) without touching game logic. Must load first. -->
    <script src="cases.js"></script>
    <script>
      /* ----------------------------------------------------------------------
       * Static UI strings (bilingual). Everything player-visible is { en, zh }.
       * -------------------------------------------------------------------- */
      const UI = {
        langLabel: { en: "Language:", zh: "语言：" },
        homeTitle: {
          en: "Core Identity Detective",
          zh: "Core Identity Detective",
        },
        homeTagline: {
          en: "Read the telemetry. Figure out what happened.",
          zh: "有限信息，无限脑补。",
        },
        homeHowTo: {
          en: "How it works: each round runs 20 scenarios. For every case, first pick what you think happened, then drag the confidence lever to bet on your call. Higher confidence scores more when you are right, but costs more when you are wrong. There are enough cases on file to play 5 rounds without repeats.",
          zh: "玩法说明：每回合 20 个场景。每个案件先选出你认为发生了什么，再拉动信心拉杆为自己的判断下注。越自信、判断正确得分越高；自信却判断错了，扣分也越狠。目前的案件量够你玩 5 轮不重样。",
        },
        start: { en: "Start Investigation", zh: "开始调查" },
        telemetry: { en: "Identity Telemetry", zh: "身份档案" },
        question: { en: "What happened?", zh: "发生了什么？" },
        confidence: { en: "Confidence", zh: "信心" },
        submit: { en: "Submit Investigation", zh: "提交调查" },
        next: { en: "Next Case", zh: "下一案件" },
        correct: { en: "Correct", zh: "判断正确" },
        incorrect: { en: "Incorrect", zh: "判断错误" },
        yourGuess: { en: "Your Guess", zh: "你的判断" },
        actualCause: { en: "Actual Cause", zh: "真实原因" },
        penalty: {
          en: "Overconfidence Penalty Applied.",
          zh: "已应用过度自信惩罚。",
        },
        score: { en: "Score", zh: "得分" },
        total: { en: "Total", zh: "总分" },
        caseWord: { en: "Case", zh: "案件" },
        difficulty: { en: "Difficulty", zh: "难度" },
        endTitle: { en: "Investigation Complete", zh: "调查完成" },
        backHome: { en: "Back to Start", zh: "返回主界面" },
        share: { en: "Share Result", zh: "分享成绩" },
        nextFy: { en: "Next Fiscal Year", zh: "进入下一财年" },
        fyTitle: {
          en: "Fiscal Year {n} Closed",
          zh: "第 {n} 财年结束",
        },
        allClearedTitle: {
          en: "Case Bank Cleared",
          zh: "已全部查完",
        },
        contribTitle: {
          en: "Out of Cases",
          zh: "案卷用尽了",
        },
        contribBody: {
          en: "You have worked every case on file in the company. Got an identity mystery of your own? Add a case to cases.js and open a pull request, the field contract is in the comment at the top of that file.",
          zh: "公司里的所有案子你都查完了。什么，你手上还有别的八卦？请往 cases.js 里加一个案件、再开个 pull request 就行，字段规则写在那个文件开头。",
        },
        contribLink: {
          en: "📫 Contribute a case on GitHub",
          zh: "📫 去 GitHub 贡献一个案件",
        },
        resetLabel: { en: "Start Over", zh: "重新来过" },
        shareCopied: { en: "Copied to clipboard.", zh: "已复制到剪贴板。" },
        shareFailed: {
          en: "Copy failed. Select and copy manually.",
          zh: "复制失败，请手动选择复制。",
        },
        shareLine: {
          en: "\"Telemetry doesn’t lie. People do.\"",
          zh: "“我沿着身份线索一路追到底。”",
        },
        continueWord: { en: "Continue", zh: "继续上一局" },
        homeLangTitleToZh: "想看中文？马上切换。",
        homeLangHintToZh:
          "进入游戏后语言按钮会移到右上角。",
        homeLangTitleToEn: "Prefer English? Switch now.",
        homeLangHintToEn:
          "Large language buttons are only on this start screen. During gameplay they move to the top-right.",
        switchToZh: "切换到中文",
        switchToEn: "Switch to English",
        diff: {
          easy: { en: "Easy", zh: "简单" },
          medium: { en: "Medium", zh: "中等" },
          hard: { en: "Hard", zh: "困难" },
        },
        // Confidence band labels (display only).
        band: [
          { max: 30, text: { en: "Cautious", zh: "大胆猜想" } },

          (e) => e.isCorrect && (ctx.byId[e.caseId].tags || []).includes(tag),
        );

      function selectedChoice(ctx, entry) {
        const c = ctx.byId[entry.caseId];
        if (!c || !Array.isArray(c.choices)) return null;
        return c.choices.find((x) => x.id === entry.selectedChoiceId) || null;
      }

      function guessedSystemFailure(ctx, entry) {
        const ch = selectedChoice(ctx, entry);
        if (!ch || !ch.label) return false;
        const en = String(ch.label.en || "").toLowerCase();
        const zh = String(ch.label.zh || "");
        return (
          /sync|backend|identity\s*service|directory/.test(en) ||
          /同步|后端|系统|身份|目录/.test(zh)
        );
      }

      const LANG_KEY = "cid-lang";
      function loadLang() {
        try {
          const saved = localStorage.getItem(LANG_KEY);
          return saved === "zh" || saved === "en" ? saved : "en";
        } catch (e) {
          return "en";
        }
      }
      function saveLang(value) {
        try {
          localStorage.setItem(LANG_KEY, value);
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }

      let lang = loadLang();
      let caseIndex = 0;
      let totalScore = 0;
      let selectedChoiceId = null;
      /* Per-case log for this run, drives the Fiscal Year review and
       * achievement checks. Entries:
       * { caseId, isCorrect, confidence, none, selectedChoiceId }. */
      let runLog = [];

      /* A run ("局") is one Fiscal Year of up to RUN_LENGTH cases, drawn from
       * the cases not yet seen in this browser (tracked in cid-seen). `order`
       * holds the real `cases` indices for the current run (length <= RUN_LENGTH,
       * all distinct); `caseIndex` is the position within `order`, so the case
       * in play is `cases[order[caseIndex]]`. Across runs there are no repeats
       * until the whole bank has been seen, at which point the run ends with a
       * "case bank cleared" prompt instead of a new run. */
      const RUN_LENGTH = 20;
      let order = [];
      let runFinished = false;

      /* Fisher-Yates shuffle, in place. */
      function shuffleInPlace(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      /* Validate a persisted run order: a non-empty array of distinct valid
       * `cases` indices, at most one full bank long. */
      function isValidOrder(arr) {
        if (!Array.isArray(arr) || arr.length === 0 || arr.length > cases.length)
          return false;
        const used = new Array(cases.length).fill(false);
        for (const v of arr) {
          if (!Number.isInteger(v) || v < 0 || v >= cases.length || used[v])
            return false;
          used[v] = true;
        }
        return true;
      }

      /* Seen-case bookmark (cid-seen): ids of every case played in this browser,
       * so successive runs never repeat a case until the bank is exhausted. */
      const SEEN_KEY = "cid-seen";
      function loadSeen() {
        try {
          const raw = localStorage.getItem(SEEN_KEY);
          const arr = raw ? JSON.parse(raw) : null;
          return Array.isArray(arr) ? arr : [];
        } catch (e) {
          return [];
        }
      }
      function addSeen(ids) {
        try {
          const merged = Array.from(new Set([...loadSeen(), ...ids]));
          localStorage.setItem(SEEN_KEY, JSON.stringify(merged));
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }
      /* Indices of cases not yet seen in this browser. */
      function unplayedIndices() {
        const seen = new Set(loadSeen());
        const out = [];
        cases.forEach((c, i) => {
          if (!seen.has(c.id)) out.push(i);
        });
        return out;
      }
      /* Pick the next run: up to RUN_LENGTH shuffled unplayed cases. */
      function pickRun() {
        return shuffleInPlace(unplayedIndices()).slice(0, RUN_LENGTH);
      }

      /* Progress persistence (cid-total / cid-progress / cid-runlog). `progress`
       * is the index of the next unplayed case; a run is resumable while
       * 0 < progress < length. The run log is persisted alongside so the
       * Fiscal Year review stays accurate after a resume. */
      const TOTAL_KEY = "cid-total";
      const PROGRESS_KEY = "cid-progress";
      const RUNLOG_KEY = "cid-runlog";
      const ORDER_KEY = "cid-order";
      function saveProgress(nextIndex, total) {
        try {
          localStorage.setItem(PROGRESS_KEY, String(nextIndex));
          localStorage.setItem(TOTAL_KEY, String(total));
          localStorage.setItem(RUNLOG_KEY, JSON.stringify(runLog));
          localStorage.setItem(ORDER_KEY, JSON.stringify(order));
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }
      function clearProgress() {
        try {
          localStorage.removeItem(PROGRESS_KEY);
          localStorage.removeItem(TOTAL_KEY);
          localStorage.removeItem(RUNLOG_KEY);
          localStorage.removeItem(ORDER_KEY);
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }
      function loadProgress() {
        try {
          const p = parseInt(localStorage.getItem(PROGRESS_KEY), 10);
          const tt = parseInt(localStorage.getItem(TOTAL_KEY), 10);
          const ord = JSON.parse(localStorage.getItem(ORDER_KEY));
          if (
            Number.isInteger(p) &&
            p > 0 &&
            isValidOrder(ord) &&
            p < ord.length &&
            Number.isFinite(tt)
          ) {
            return { progress: p, total: tt, order: ord };
          }
        } catch (e) {
          /* storage unavailable; ignore */
        }
        return null;
      }
      function loadRunLog() {
        try {
          const raw = localStorage.getItem(RUNLOG_KEY);
          const arr = raw ? JSON.parse(raw) : null;
          return Array.isArray(arr) ? arr : [];
        } catch (e) {
          return [];
        }
      }

      /* Cumulative achievement unlocks (cid-achievements), persisted across runs. */
      const ACH_KEY = "cid-achievements";
      function loadAchievements() {
        try {
          const raw = localStorage.getItem(ACH_KEY);
          const arr = raw ? JSON.parse(raw) : null;
          return Array.isArray(arr) ? arr : [];
        } catch (e) {
          return [];
        }
      }
      function saveAchievements(ids) {
        try {
          localStorage.setItem(ACH_KEY, JSON.stringify(ids));
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }

      /* Helpers ------------------------------------------------------------- */
      const $ = (id) => document.getElementById(id);
      const t = (pair) =>
        pair && pair[lang] != null ? pair[lang] : pair ? pair.en : "";

      function show(screenId) {
        ["screen-home", "screen-case", "screen-result", "screen-end"].forEach(
          (s) => {
            $(s).classList.toggle("hidden", s !== screenId);
          },
        );
        document.body.classList.toggle("mode-home", screenId === "screen-home");
      }

      function bandLabel(value) {
        const b =
          UI.band.find((x) => value <= x.max) || UI.band[UI.band.length - 1];
        return t(b.text);
      }

      function scoreTitle(total) {
        const band =
          UI.scoreTitle.find((x) => total >= x.min) ||
          UI.scoreTitle[UI.scoreTitle.length - 1];
        return t(band.text);
      }

      /* Static text that does not depend on the current screen's dynamic data. */
      function renderStatic() {
        document.documentElement.lang = lang;
        $("home-title").textContent = t(UI.homeTitle);
        $("home-tagline").textContent = t(UI.homeTagline);
        $("home-howto").textContent = t(UI.homeHowTo);
        $("btn-start").textContent = t(UI.start);
        const showOppositeEnglish = lang === "zh";
        $("home-lang-title").textContent = showOppositeEnglish
          ? UI.homeLangTitleToEn
          : UI.homeLangTitleToZh;
        $("home-lang-hint").textContent = showOppositeEnglish
          ? UI.homeLangHintToEn
          : UI.homeLangHintToZh;
        // Show the target language explicitly to avoid ambiguity:
        // EN page -> "切换到中文", ZH page -> "Switch to English".
        $("btn-home-switch").textContent =
          lang === "en" ? UI.switchToZh : UI.switchToEn;
        $("btn-submit").textContent = t(UI.submit);
        $("btn-next").textContent = t(UI.next);
        $("btn-home").textContent = t(UI.backHome);
        $("label-telemetry").textContent = t(UI.telemetry);
        $("label-question").textContent = t(UI.question);
        $("label-confidence").textContent = t(UI.confidence);
        document.querySelector(".meta-lang").textContent = t(UI.langLabel);
        $("lang-en").classList.toggle("active", lang === "en");
        $("lang-zh").classList.toggle("active", lang === "zh");

        // Continue button only appears when a resumable run is saved.
        const cont = $("btn-continue");
        cont.textContent = t(UI.continueWord);
        cont.classList.toggle("hidden", loadProgress() === null);
      }

      /* Re-render whichever screen is currently visible (for language toggle). */
      function rerenderCurrent() {
        renderStatic();
        if (!$("screen-case").classList.contains("hidden")) renderCase();
        if (!$("screen-result").classList.contains("hidden")) {
          /* result re-render */ renderResult(lastResult);
        }
        if (!$("screen-end").classList.contains("hidden")) renderEnd();
      }

      /* Case screen --------------------------------------------------------- */
      function renderCase() {
        const c = cases[order[caseIndex]];
        const keyValueSep = lang === "zh" ? "：" : ":";
        $("case-meta").textContent =
          `${t(UI.caseWord)} #${String(caseIndex + 1).padStart(3, "0")}  ·  ${t(UI.difficulty)}: ${t(UI.diff[c.difficulty])}`;
        $("case-title").textContent = t(c.title);
        $("case-intro").textContent = t(c.intro);

        const tele = $("telemetry");
        tele.innerHTML = "";
        c.telemetry.forEach((row) => {
          const div = document.createElement("div");
          div.className = "tele-row";
          div.innerHTML =
            `<span class="tele-key">${t(row.key)}${keyValueSep}</span>` +
            `<span class="tele-val status-${row.status}">${t(row.value)}</span>`;
          tele.appendChild(div);
        });

        const list = $("choices");
        list.innerHTML = "";
        c.choices.forEach((ch) => {
          const li = document.createElement("li");
          li.className =
            "choice" + (selectedChoiceId === ch.id ? " selected" : "");
          li.innerHTML =
            `<label style="cursor:pointer;display:block;">` +
            `<input type="radio" name="choice" value="${ch.id}" ${selectedChoiceId === ch.id ? "checked" : ""}/>` +
            `${t(ch.label)}</label>`;
          li.querySelector("input").addEventListener("change", () => {
            selectedChoiceId = ch.id;
            $("btn-submit").disabled = false;
            [...list.children].forEach((x) => x.classList.remove("selected"));
            li.classList.add("selected");
          });
          list.appendChild(li);
        });

        const conf = $("confidence");
        $("confidence-val").textContent = conf.value + "%";
        $("confidence-label").textContent = bandLabel(Number(conf.value));
        $("btn-submit").disabled = selectedChoiceId === null;
      }

      /* Result screen ------------------------------------------------------- */
      let lastResult = null;
      /* Achievements unlocked for the first time on the run that just ended.
       * Computed once in nextCase() so language re-renders do not re-commit. */
      let lastFreshAchievements = [];

      function submitCase() {
        if (selectedChoiceId === null) return;
        const realIndex = order[caseIndex];
        const c = cases[realIndex];
        const confidence = Number($("confidence").value);
        const isCorrect = c.answer !== "none" && selectedChoiceId === c.answer;
        const delta = isCorrect ? Math.round(50 + confidence / 2) : -confidence;
        totalScore += delta;

        lastResult = {
          caseIndex: realIndex,
          selectedChoiceId,
          confidence,
          isCorrect,
          delta,
        };
        runLog.push({
          caseId: c.id,
          isCorrect,
          confidence,
          none: c.answer === "none",
          selectedChoiceId,
        });
        saveProgress(caseIndex + 1, totalScore);
        renderResult(lastResult);
        show("screen-result");
      }

      function renderResult(r) {
        if (!r) return;
        const c = cases[r.caseIndex];
        const guess = c.choices.find((x) => x.id === r.selectedChoiceId);
        /* The real cause is derived from the answer choice's label, so it is
         * never duplicated in the data. Unanswerable ("none") cases have no
         * such choice, so they carry an explicit `actualCause` instead. */
        const answerChoice = c.choices.find((x) => x.id === c.answer);
        const causeLabel =
          c.answer === "none"
            ? t(c.actualCause)
            : answerChoice
              ? t(answerChoice.label)
              : "-";

        const verdict = $("verdict");
        verdict.textContent = r.isCorrect ? t(UI.correct) : t(UI.incorrect);
        verdict.className = "verdict " + (r.isCorrect ? "correct" : "wrong");

        const lines = $("result-lines");
        lines.innerHTML = "";
        const addLine = (s) => {
          const p = document.createElement("p");
          p.className = "result-line";
          p.textContent = s;
          lines.appendChild(p);
        };
        if (!r.isCorrect) {
          addLine(`${t(UI.yourGuess)}: ${guess ? t(guess.label) : "-"}`);
          addLine(`${t(UI.confidence)}: ${r.confidence}%`);
        }
        addLine(`${t(UI.actualCause)}: ${causeLabel}`);
        if (!r.isCorrect && r.confidence >= 90) addLine(t(UI.penalty));

        $("explanation").textContent = t(c.explanation);
        $("result-flavor").textContent = r.isCorrect
          ? t(c.resultFlavor.correct)
          : t(c.resultFlavor.wrong);

        const sign = r.delta >= 0 ? "+" : "";
        $("score-delta").textContent = `${t(UI.score)}: ${sign}${r.delta}`;
        $("total-score").textContent = `${t(UI.total)}: ${totalScore}`;
      }

      /* End-of-run screen --------------------------------------------------- */
      /* Compute the run's summary stats from runLog. Ghost / "none" cases are
       * unscorable and excluded from accuracy. */
      function fyStats() {
        const scoredEntries = runLog.filter((e) => !e.none);
        const scored = scoredEntries.length;
        const solved = scoredEntries.filter((e) => e.isCorrect).length;
        const overconfident = runLog.filter(
          (e) => !e.isCorrect && e.confidence >= 90,
        ).length;
        const avgConfidence = runLog.length
          ? Math.round(
              runLog.reduce((a, e) => a + e.confidence, 0) / runLog.length,
            )
          : 0;
        return {
          answered: runLog.length,
          scored,
          solved,
          overconfident,
          avgConfidence,
          accuracy: scored ? solved / scored : 0,
        };
      }

      function reviewVerdict(stats) {
        const v =
          REVIEW_VERDICTS.find((x) => x.cond(stats)) ||
          REVIEW_VERDICTS[REVIEW_VERDICTS.length - 1];
        return t(v.text);
      }

      /* Evaluate achievements for the finished run, merge with stored unlocks,
       * and return the ids unlocked for the first time this run. */
      function commitAchievements(stats) {
        const byId = {};
        cases.forEach((c) => {
          byId[c.id] = c;
        });
        const ctx = { stats, log: runLog, byId };
        const earned = ACHIEVEMENTS.filter((a) => {
          try {
            return a.cond(ctx);
          } catch (e) {
            return false;
          }
        }).map((a) => a.id);

        const stored = loadAchievements();
        const fresh = earned.filter((id) => !stored.includes(id));
        if (fresh.length) saveAchievements([...stored, ...fresh]);
        return fresh;
      }

      function renderFyReview(stats) {
        const box = $("fy-review");
        const pct = (n) => `${Math.round(n * 100)}%`;
        const row = (key, val) =>
          `<div class="fy-stat"><span class="fy-key">${key}</span>` +
          `<span class="fy-val">${val}</span></div>`;
        box.innerHTML =
          `<h2>${t(UI.reviewTitle)}</h2>` +
          row(t(UI.statSolved), `${stats.solved} / ${stats.scored}`) +
          row(t(UI.statAccuracy), pct(stats.accuracy)) +
          row(t(UI.statOverconfident), String(stats.overconfident)) +
          row(t(UI.statAvgConfidence), `${stats.avgConfidence}%`) +
          `<p class="fy-verdict">${reviewVerdict(stats)}</p>`;
      }

      function renderAchievements(freshIds) {
        const box = $("achievements-block");
        const unlocked = loadAchievements();
        const fresh = new Set(freshIds);
        // Show newly-unlocked first, then any other already-unlocked ones.
        const shown = ACHIEVEMENTS.filter((a) => unlocked.includes(a.id)).sort(
          (a, b) => (fresh.has(b.id) ? 1 : 0) - (fresh.has(a.id) ? 1 : 0),
        );
        const items = shown
          .map((a) => {
            const isNew = fresh.has(a.id);
            return (
              `<div class="ach-item">` +
              `<div class="ach-name">${isNew ? "\u2728 " : ""}${t(a.name)}</div>` +
              `<div class="ach-desc">${t(a.desc)}</div></div>`
            );
          })
          .join("");
        const sub = freshIds.length
          ? `${t(UI.achNew)}: ${freshIds.length}`
          : t(UI.achNone);
        box.innerHTML =
          `<h2>${t(UI.achievementsTitle)}</h2>` +
          `<p class="ach-sub">${sub} \u00b7 ${t(UI.achProgress)}: ${unlocked.length} / ${ACHIEVEMENTS.length}</p>` +
          items;
      }

      function renderEnd() {
        /* Two end states share this screen:
         *  - a finished run (runLog has entries): Fiscal Year review + maybe the
         *    contribution prompt if that run drained the bank;
         *  - "Start" pressed with the bank already cleared (runLog empty): only
         *    the contribution prompt. `runFinished` means the bank is exhausted. */
        const emptyExhausted = runFinished && runLog.length === 0;
        const fyNumber = Math.max(1, Math.ceil(loadSeen().length / RUN_LENGTH));

        if (emptyExhausted) {
          $("end-title").textContent = t(UI.allClearedTitle);
        } else {
          $("end-title").textContent = t(UI.fyTitle).replace(
            "{n}",
            String(fyNumber),
          );
        }
        $("end-flavor").textContent = emptyExhausted ? "" : scoreTitle(totalScore);
        $("end-score").textContent = emptyExhausted
          ? ""
          : `${t(UI.total)}: ${totalScore} / ${order.length * 100}`;
        $("btn-share").textContent = t(UI.share);
        $("btn-next-fy").textContent = t(UI.nextFy);
        $("btn-home").textContent = t(UI.backHome);
        $("btn-reset").textContent = t(UI.resetLabel);
        $("share-feedback").textContent = "";

        // Offer the next Fiscal Year only while unplayed cases remain.
        $("btn-next-fy").classList.toggle("hidden", runFinished);
        // Share only makes sense for an actual scored run.
        $("btn-share").classList.toggle("hidden", emptyExhausted);
        // Reset is shown only when the bank is exhausted.
        $("btn-reset").classList.toggle("hidden", !runFinished);

        // Contribution prompt whenever the bank is exhausted.
        const contrib = $("contribution");
        if (runFinished) {
          contrib.classList.remove("hidden");
          contrib.innerHTML =
            `<h2>${t(UI.contribTitle)}</h2>` +
            `<p class="fy-verdict">${t(UI.contribBody)}</p>` +
            `<p><a href="https://github.com/Sayaka-4987/Core-Identity-Detective" ` +
            `target="_blank" rel="noopener">${t(UI.contribLink)}</a></p>`;
        } else {
          contrib.classList.add("hidden");
          contrib.innerHTML = "";
        }

        // FY stats / achievements only for a run that was actually played.
        $("fy-review").classList.toggle("hidden", emptyExhausted);
        $("achievements-block").classList.toggle("hidden", emptyExhausted);
        if (!emptyExhausted) {
          renderFyReview(fyStats());
          renderAchievements(lastFreshAchievements);
        }
      }

      function shareText() {
        return [
          t(UI.homeTitle),
          `${t(UI.total)}: ${totalScore} / ${order.length * 100} · ${scoreTitle(totalScore)}`,
          t(UI.shareLine),
          "https://sayaka-4987.github.io/Core-Identity-Detective/",
        ].join("\n");
      }

      async function shareResult() {
        const text = shareText();
        try {
          await navigator.clipboard.writeText(text);
          $("share-feedback").textContent = t(UI.shareCopied);
        } catch (e) {
          $("share-feedback").textContent = t(UI.shareFailed);
        }
      }

      /* Navigation ---------------------------------------------------------- */
      function startRun() {
        clearProgress();
        const pool = pickRun();
        totalScore = 0;
        selectedChoiceId = null;
        runLog = [];
        // Bank already cleared this browser: go straight to the prompt.
        if (pool.length === 0) {
          order = [];
          caseIndex = 0;
          runFinished = true;
          renderEnd();
          show("screen-end");
          return;
        }
        order = pool;
        caseIndex = 0;
        runFinished = false;
        $("confidence").value = 50;
        renderCase();
        show("screen-case");
      }

      function resumeRun() {
        const saved = loadProgress();
        if (!saved) {
          startRun();
          return;
        }
        order = saved.order;
        caseIndex = saved.progress;
        runFinished = false;
        totalScore = saved.total;
        selectedChoiceId = null;
        runLog = loadRunLog();
        $("confidence").value = 50;
        renderCase();
        show("screen-case");
      }

      function nextCase() {
        caseIndex += 1;
        // Run complete: record the cases as seen, then show the Fiscal Year
        // review (plus the contribution prompt if the bank is now empty).
        if (caseIndex >= order.length) {
          clearProgress();
          addSeen(order.map((i) => cases[i].id));
          runFinished = unplayedIndices().length === 0;
          lastFreshAchievements = commitAchievements(fyStats());
          renderEnd();
          show("screen-end");
          return;
        }
        selectedChoiceId = null;
        $("confidence").value = 50;
        renderCase();
        show("screen-case");
      }

      // From the review screen, start the next Fiscal Year (next unplayed run).
      function nextFiscalYear() {
        startRun();
      }

      // Clear all seen-case bookmarks so every case can be played again.
      function resetSeen() {
        localStorage.removeItem(SEEN_KEY);
        startRun();
      }

      /* Wiring -------------------------------------------------------------- */
      $("lang-en").addEventListener("click", () => {
        lang = "en";
        saveLang(lang);
        rerenderCurrent();
      });
      $("lang-zh").addEventListener("click", () => {
        lang = "zh";
        saveLang(lang);
        rerenderCurrent();
      });
      $("btn-home-switch").addEventListener("click", () => {
        lang = lang === "en" ? "zh" : "en";
        saveLang(lang);
        rerenderCurrent();
      });
      $("btn-start").addEventListener("click", startRun);
      $("btn-continue").addEventListener("click", resumeRun);
      $("btn-submit").addEventListener("click", submitCase);
      $("btn-next").addEventListener("click", nextCase);
      $("btn-next-fy").addEventListener("click", nextFiscalYear);
      $("btn-reset").addEventListener("click", resetSeen);
      $("btn-home").addEventListener("click", () => {
        renderStatic();
        show("screen-home");
      });
      $("btn-share").addEventListener("click", shareResult);
      $("confidence").addEventListener("input", () => {
        $("confidence-val").textContent = $("confidence").value + "%";
        $("confidence-label").textContent = bandLabel(
          Number($("confidence").value),
        );
      });

      renderStatic();
      show("screen-home");
    </script>
  </body>
</html>
