<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core Identity Detective</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2330;
        --border: #30363d;
        --text: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --green: #3fb950;
        --yellow: #d29922;
        --red: #f85149;
        --gray: #6e7681;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Microsoft YaHei", sans-serif;
        line-height: 1.55;
        min-height: 100vh;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      header.bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .brand {
        font-family: var(--mono);
        font-weight: 600;
        color: var(--accent);
      }
      .lang-toggle button {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 14px;
        padding: 4px 6px;
      }
      .lang-toggle button.active {
        color: var(--text);
        font-weight: 600;
        text-decoration: underline;
      }
      .lang-toggle span {
        color: var(--border);
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 24px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 6px;
      }
      .tagline {
        color: var(--muted);
        margin: 0 0 28px;
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 18px;
      }

      button.primary {
        background: var(--accent);
        color: #07101f;
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary:disabled {
        background: var(--border);
        color: var(--muted);
        cursor: not-allowed;
      }
      button.ghost {
        background: none;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 15px;
        cursor: pointer;
      }
      .btn-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .section-title {
        font-family: var(--mono);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 22px 0 10px;
      }

      .telemetry {
        font-family: var(--mono);
        font-size: 14px;
      }
      .tele-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 10px;
        border-radius: 5px;
        background: var(--panel-2);
        margin-bottom: 6px;
      }
      .tele-key {
        color: var(--muted);
      }
      .tele-val {
        font-weight: 600;
      }
      .status-normal {
        color: var(--green);
      }
      .status-warning {
        color: var(--yellow);
      }
      .status-alarming {
        color: var(--red);
      }
      .status-unknown {
        color: var(--gray);
      }

      .choices {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .choice {
        display: block;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .choice:hover {
        border-color: var(--accent);
      }
      .choice input {
        margin-right: 10px;
      }
      .choice.selected {
        border-color: var(--accent);
        background: rgba(88, 166, 255, 0.08);
      }

      .confidence-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 6px 0 4px;
      }
      .confidence-row input[type="range"] {
        flex: 1;
      }
      .confidence-val {
        font-family: var(--mono);
        min-width: 48px;
        text-align: right;
      }
      .confidence-label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 18px;
      }

      .verdict {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      .verdict.correct {
        color: var(--green);
      }
      .verdict.wrong {
        color: var(--red);
      }
      .result-line {
        margin: 4px 0;
      }
      .score-delta {
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 700;
        margin: 14px 0 4px;
      }
      .total-score {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 14px;
      }
      .explanation {
        background: var(--panel-2);
        border-radius: 6px;
        padding: 12px 14px;
        margin: 14px 0;
      }
      .flavor {
        color: var(--muted);
        font-style: italic;
        margin: 8px 0 0;
      }

      .fy-review {
        background: var(--panel-2);
        border-radius: 6px;
        padding: 14px 16px;
        margin: 18px 0;
        text-align: left;
      }
      .fy-review h2 {
        font-family: var(--mono);
        font-size: 15px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0 0 10px;
        color: var(--green);
      }
      .fy-stat {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 13px;
        padding: 3px 0;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      }
      .fy-stat .fy-key {
        color: var(--muted);
      }
      .fy-verdict {
        margin: 12px 0 0;
        font-style: italic;
        line-height: 1.45;
      }

      .achievements {
        text-align: left;
        margin: 18px 0;
      }
      .achievements h2 {
        font-family: var(--mono);
        font-size: 15px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0 0 8px;
        color: var(--yellow);
      }
      .ach-sub {
        color: var(--muted);
        font-size: 12px;
        margin: 0 0 8px;
        font-family: var(--mono);
      }
      .ach-item {
        background: var(--panel-2);
        border-left: 3px solid var(--yellow);
        border-radius: 4px;
        padding: 8px 12px;
        margin: 6px 0;
      }
      .ach-item.locked {
        border-left-color: rgba(255, 255, 255, 0.12);
        opacity: 0.55;
      }
      .ach-name {
        font-weight: 700;
        font-size: 14px;
      }
      .ach-desc {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="bar">
        <span class="brand">Core Identity Detective</span>
        <div class="lang-toggle">
          <span class="meta-lang" data-lang="label"></span>
          <button id="lang-en">English</button>
          <span>|</span>
          <button id="lang-zh">中文</button>
        </div>
      </header>

      <!-- HOME -->
      <section id="screen-home" class="card">
        <h1 id="home-title"></h1>
        <p class="tagline" id="home-tagline"></p>
        <div class="btn-row">
          <button class="primary" id="btn-start"></button>
          <button class="ghost hidden" id="btn-continue"></button>
        </div>
      </section>

      <!-- CASE -->
      <section id="screen-case" class="card hidden">
        <p class="meta" id="case-meta"></p>
        <h1 id="case-title" style="font-size: 22px"></h1>
        <p id="case-intro"></p>

        <div class="section-title" id="label-telemetry"></div>
        <div class="telemetry" id="telemetry"></div>

        <div class="section-title" id="label-question"></div>
        <ul class="choices" id="choices"></ul>

        <div class="section-title" id="label-confidence"></div>
        <div class="confidence-row">
          <input
            type="range"
            id="confidence"
            min="0"
            max="100"
            step="5"
            value="50"
          />
          <span class="confidence-val" id="confidence-val">50%</span>
        </div>
        <div class="confidence-label" id="confidence-label"></div>

        <div class="btn-row">
          <button class="primary" id="btn-submit" disabled></button>
        </div>
      </section>

      <!-- RESULT -->
      <section id="screen-result" class="card hidden">
        <p class="verdict" id="verdict"></p>
        <div id="result-lines"></div>
        <div class="explanation" id="explanation"></div>
        <p class="flavor" id="result-flavor"></p>
        <div class="score-delta" id="score-delta"></div>
        <div class="total-score" id="total-score"></div>
        <div class="btn-row">
          <button class="primary" id="btn-next"></button>
        </div>
      </section>

      <!-- END OF RUN -->
      <section id="screen-end" class="card hidden">
        <h1 id="end-title"></h1>
        <p id="end-flavor" class="tagline"></p>
        <div class="score-delta" id="end-score"></div>

        <!-- Fiscal Year performance review (computed from this run's log). -->
        <div id="fy-review" class="fy-review"></div>

        <!-- Achievements unlocked (cumulative across runs). -->
        <div id="achievements-block" class="achievements"></div>

        <div class="btn-row">
          <button class="primary" id="btn-home"></button>
          <button class="ghost" id="btn-share"></button>
        </div>
        <p class="flavor" id="share-feedback"></p>
      </section>
    </div>

    <!-- Case content lives in cases.js so it can grow toward 20 cases
         (one Fiscal Year) without touching game logic. Must load first. -->
    <script src="cases.js"></script>
    <script>
      /* ----------------------------------------------------------------------
       * Static UI strings (bilingual). Everything player-visible is { en, zh }.
       * -------------------------------------------------------------------- */
      const UI = {
        langLabel: { en: "Language:", zh: "语言：" },
        homeTitle: {
          en: "Core Identity Detective",
          zh: "Core Identity Detective",
        },
        homeTagline: {
          en: "Follow the telemetry. Find the truth.",
          zh: "读取 Profile，找出真相。",
        },
        start: { en: "Start Investigation", zh: "开始调查" },
        telemetry: { en: "Identity Telemetry", zh: "身份档案" },
        question: { en: "What happened?", zh: "发生了什么？" },
        confidence: { en: "Confidence", zh: "信心" },
        submit: { en: "Submit Investigation", zh: "提交调查" },
        next: { en: "Next Case", zh: "下一案件" },
        correct: { en: "Correct", zh: "判断正确" },
        incorrect: { en: "Incorrect", zh: "判断错误" },
        yourGuess: { en: "Your Guess", zh: "你的判断" },
        actualCause: { en: "Actual Cause", zh: "真实原因" },
        penalty: {
          en: "Overconfidence Penalty Applied.",
          zh: "已应用过度自信惩罚。",
        },
        score: { en: "Score", zh: "得分" },
        total: { en: "Total", zh: "总分" },
        caseWord: { en: "Case", zh: "案件" },
        difficulty: { en: "Difficulty", zh: "难度" },
        endTitle: { en: "Investigation Complete", zh: "调查完成" },
        backHome: { en: "Back to Start", zh: "返回主界面" },
        share: { en: "Share Result", zh: "分享成绩" },
        shareCopied: { en: "Copied to clipboard.", zh: "已复制到剪贴板。" },
        shareFailed: {
          en: "Copy failed. Select and copy manually.",
          zh: "复制失败，请手动选择复制。",
        },
        shareLine: {
          en: "I followed the telemetry.",
          zh: "我把他们的个人主页从头读了一遍。",
        },
        continueWord: { en: "Continue", zh: "继续上一局" },
        diff: {
          easy: { en: "Easy", zh: "简单" },
          medium: { en: "Medium", zh: "中等" },
          hard: { en: "Hard", zh: "困难" },
        },
        // Confidence band labels (display only).
        band: [
          { max: 30, text: { en: "Cautious", zh: "大胆猜想" } },
          { max: 70, text: { en: "Reasonable", zh: "小心推测" } },
          { max: 90, text: { en: "Confident", zh: "自信推断" } },
          { max: 100, text: { en: "Famous Last Words", zh: "全部梭哈" } },
        ],
        // Final-score title bands (total ranges roughly -500..500 over 5 cases).
        // Checked high-to-low; the first band whose `min` the score meets wins.
        scoreTitle: [
          { min: 350, text: { en: "Master Detective", zh: "业界首席侦探" } },
          { min: 150, text: { en: "Senior Investigator", zh: "传奇调查员" } },
          { min: 0, text: { en: "Cautious Analyst", zh: "谨慎的分析师" } },
          {
            min: -200,
            text: { en: "Overconfident Engineer", zh: "过度自信工程师" },
          },
          {
            min: -Infinity,
            text: { en: "Root Cause: You", zh: "事故根因：你" },
          },
        ],
        // Fiscal Year performance review (end screen).
        reviewTitle: { en: "Fiscal Year Review", zh: "财年绩效盘点" },
        statAccuracy: { en: "Accuracy", zh: "判断正确率" },
        statSolved: { en: "Cases Solved", zh: "正确结案" },
        statOverconfident: {
          en: "Overconfident Misses",
          zh: "过度自信的误判",
        },
        statAvgConfidence: { en: "Avg. Confidence", zh: "平均信心" },
        // Achievements (end screen).
        achievementsTitle: { en: "Achievements", zh: "成就" },
        achNew: { en: "Newly unlocked this run", zh: "本局新解锁" },
        achNone: {
          en: "No new achievements this run.",
          zh: "本局没有解锁新成就。",
        },
        achProgress: { en: "Unlocked", zh: "已解锁" },
      };

      /* ----------------------------------------------------------------------
       * Fiscal Year review verdicts. Evaluated high-to-low; first match wins.
       * `cond(s)` reads the computed run stats object (see fyStats()).
       * -------------------------------------------------------------------- */
      const REVIEW_VERDICTS = [
        {
          cond: (s) => s.scored === 0,
          text: {
            en: "No scorable cases this run. The telemetry told you nothing, and you wisely expected nothing.",
            zh: "本局没有可评分的案件。数据什么也没说，而你也明智地什么都没指望。",
          },
        },
        {
          cond: (s) => s.accuracy >= 0.8 && s.overconfident === 0,
          text: {
            en: "Calibrated and correct. You investigated like someone who has been paged at 3am before.",
            zh: "既准又稳。你查案的样子，像个凌晨三点被 oncall 叫起来过的人。",
          },
        },
        {
          cond: (s) => s.accuracy >= 0.8,
          text: {
            en: "Accurate, but your confidence ran ahead of your evidence at least once. Promising. Loud.",
            zh: "判断很准，但是太自信了。有前途，就是嗓门大。",
          },
        },
        {
          cond: (s) => s.accuracy >= 0.5,
          text: {
            en: "Middling. You are right about as often as the org chart is.",
            zh: "中规中矩。你说对的概率，跟组织架构图差不多。",
          },
        },
        {
          cond: (s) => s.accuracy < 0.5 && s.overconfident > 0,
          text: {
            en: "Both wrong and loud. A classic combination. Consider listening to the telemetry next time.",
            zh: "又菜又爱玩，经典组合。下次考虑动动脑子吧。",
          },
        },
        {
          cond: () => true,
          text: {
            en: "More wrong than right. 'Insufficient telemetry' is a perfectly respectable default.",
            zh: "错的比对的多。其实“数据不足”是个相当体面的默认答案。",
          },
        },
      ];

      /* ----------------------------------------------------------------------
       * Achievement definitions. Each is unlocked when `cond(ctx)` is true for
       * a finished run. Unlocks are cumulative and persisted in cid-achievements.
       * ctx = { stats, log, byId } where log entries are
       *   { caseId, isCorrect, confidence, none } and byId maps id -> case.
       * Helpers: solvedTag(tag) = a case carrying `tag` was answered correctly.
       * -------------------------------------------------------------------- */
      const ACHIEVEMENTS = [
        {
          id: "first-contact",
          name: { en: "First Contact", zh: "初次接案" },
          desc: {
            en: "Close your first case.",
            zh: "完成你的第一个案件。",
          },
          cond: (ctx) => ctx.log.length >= 1,
        },
        {
          id: "fiscal-year-complete",
          name: { en: "Fiscal Year Complete", zh: "熬过一个财年" },
          desc: {
            en: "Reach the end of a full run.",
            zh: "走完一个财年的调查。",
          },
          cond: (ctx) => ctx.log.length >= cases.length,
        },
        {
          id: "flawless-audit",
          name: { en: "Flawless Audit", zh: "完美审计" },
          desc: {
            en: "Solve every scorable case in a run.",
            zh: "本局每一个案件都判断正确。",
          },
          cond: (ctx) => ctx.stats.scored > 0 && ctx.stats.solved === ctx.stats.scored,
        },
        {
          id: "i-dont-know",
          name: { en: "I Don't Know", zh: "我不知道" },
          desc: {
            en: "Stay humble (confidence ≤ 30) on a case with insufficient telemetry.",
            zh: "在数据不足的案件上保持谦逊（信心 ≤ 30）。",
          },
          cond: (ctx) =>
            ctx.log.some(
              (e) =>
                (ctx.byId[e.caseId].tags || []).includes(
                  "insufficient-telemetry",
                ) && e.confidence <= 30,
            ),
        },
        {
          id: "overconfidence-any",
          name: { en: "Overconfidence Any%", zh: "过度自信 Any%" },
          desc: {
            en: "Be wrong at 90%+ confidence at least once.",
            zh: "至少一次在 90%+ 信心下判断错误。",
          },
          cond: (ctx) =>
            ctx.log.some((e) => !e.isCorrect && e.confidence >= 90),
        },
        {
          id: "not-a-layoff",
          name: { en: "Not A Layoff", zh: "这不是裁员" },
          desc: {
            en: "Correctly call a disappearance that turned out not to be a departure.",
            zh: "正确识破一次“看似离职、其实没走”的消失。",
          },
          cond: (ctx) =>
            solvedTag(ctx, "not-a-layoff") || solvedTag(ctx, "not-a-departure"),
        },
        {
          id: "it-was-sync-again",
          name: { en: "It Was Sync Again", zh: "又是同步炸了" },
          desc: {
            en: "Correctly blame an identity sync failure.",
            zh: "正确把锅甩给身份同步故障。",
          },
          cond: (ctx) => solvedTag(ctx, "sync"),
        },
        {
          id: "org-chart-archaeologist",
          name: { en: "Org Chart Archaeologist", zh: "组织架构考古学家" },
          desc: {
            en: "Correctly trace a problem back to a reorg.",
            zh: "正确把问题追溯到一次 reorg。",
          },
          cond: (ctx) => solvedTag(ctx, "reorg") || solvedTag(ctx, "org-chart"),
        },
        {
          id: "actually-a-layoff",
          name: { en: "Actually A Layoff", zh: "这次真裁了" },
          desc: {
            en: "Call a layoff correctly when every signal really does point that way.",
            zh: "当所有信号真的都指向裁员时，正确地说出来。",
          },
          cond: (ctx) => solvedTag(ctx, "actually-a-layoff"),
        },
        {
          id: "it-was-dns",
          name: { en: "It Was DNS", zh: "是 DNS 的锅" },
          desc: {
            en: "Blame DNS, correctly, for once.",
            zh: "难得一次，正确地把锅甩给 DNS。",
          },
          cond: (ctx) => solvedTag(ctx, "dns") || ctx.byId["case-020"] && ctx.log.some((e) => e.caseId === "case-020" && e.isCorrect),
        },
        {
          id: "the-counteroffer",
          name: { en: "Retention Specialist", zh: "挽留专家" },
          desc: {
            en: "Correctly spot a coworker who was leaving, then stayed.",
            zh: "识破一个本想走、最后留下的同事。",
          },
          cond: (ctx) => solvedTag(ctx, "counteroffer"),
        },
        {
          id: "the-promotion",
          name: { en: "Reading the Arrow", zh: "读懂那个按钮" },
          desc: {
            en: "Correctly identify a promotion or new title instead of a departure.",
            zh: "把升职或头衔变化正确读成升职，而不是离职。",
          },
          cond: (ctx) => solvedTag(ctx, "promotion") || solvedTag(ctx, "title-change"),
        },
        {
          id: "gold-watch",
          name: { en: "Gold Watch", zh: "光荣退休" },
          desc: {
            en: "Correctly read a retirement instead of a layoff.",
            zh: "把退休正确读成退休，而不是裁员。",
          },
          cond: (ctx) =>
            ctx.byId["case-031"] &&
            ctx.log.some((e) => e.caseId === "case-031" && e.isCorrect),
        },
        {
          id: "mercury-retrograde",
          name: { en: "Mercury Retrograde", zh: "水逆" },
          desc: {
            en: "Blame a planet and somehow be right.",
            zh: "把锅甩给一颗行星，居然还甩对了。",
          },
          cond: (ctx) =>
            ctx.byId["case-040"] &&
            ctx.log.some((e) => e.caseId === "case-040" && e.isCorrect),
        },
        {
          id: "saw-it-coming",
          name: { en: "Saw It Coming", zh: "你看出来了" },
          desc: {
            en: "Correctly call a real departure when every signal says gone.",
            zh: "在所有信号都指向离开时，正确判断出真的走了。",
          },
          cond: (ctx) => solvedTag(ctx, "actually-leaving"),
        },
      ];

      function solvedTag(ctx, tag) {
        return ctx.log.some(
          (e) => e.isCorrect && (ctx.byId[e.caseId].tags || []).includes(tag),
        );
      }

      /* ----------------------------------------------------------------------
       * Case data (`cases`) is loaded from cases.js, which runs before this
       * script. See that file for the field contract.
       * -------------------------------------------------------------------- */

      /* ----------------------------------------------------------------------
       * State (session only; only the UI language is persisted via LocalStorage).
       * -------------------------------------------------------------------- */
      const LANG_KEY = "cid-lang";
      function loadLang() {
        try {
          const saved = localStorage.getItem(LANG_KEY);
          return saved === "zh" || saved === "en" ? saved : "en";
        } catch (e) {
          return "en";
        }
      }
      function saveLang(value) {
        try {
          localStorage.setItem(LANG_KEY, value);
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }

      let lang = loadLang();
      let caseIndex = 0;
      let totalScore = 0;
      let selectedChoiceId = null;
      /* Per-case log for this run, drives the Fiscal Year review and
       * achievement checks. Entries: { caseId, isCorrect, confidence, none }. */
      let runLog = [];

      /* Progress persistence (cid-total / cid-progress / cid-runlog). `progress`
       * is the index of the next unplayed case; a run is resumable while
       * 0 < progress < length. The run log is persisted alongside so the
       * Fiscal Year review stays accurate after a resume. */
      const TOTAL_KEY = "cid-total";
      const PROGRESS_KEY = "cid-progress";
      const RUNLOG_KEY = "cid-runlog";
      function saveProgress(nextIndex, total) {
        try {
          localStorage.setItem(PROGRESS_KEY, String(nextIndex));
          localStorage.setItem(TOTAL_KEY, String(total));
          localStorage.setItem(RUNLOG_KEY, JSON.stringify(runLog));
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }
      function clearProgress() {
        try {
          localStorage.removeItem(PROGRESS_KEY);
          localStorage.removeItem(TOTAL_KEY);
          localStorage.removeItem(RUNLOG_KEY);
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }
      function loadProgress() {
        try {
          const p = parseInt(localStorage.getItem(PROGRESS_KEY), 10);
          const tt = parseInt(localStorage.getItem(TOTAL_KEY), 10);
          if (
            Number.isInteger(p) &&
            p > 0 &&
            p < cases.length &&
            Number.isFinite(tt)
          ) {
            return { progress: p, total: tt };
          }
        } catch (e) {
          /* storage unavailable; ignore */
        }
        return null;
      }
      function loadRunLog() {
        try {
          const raw = localStorage.getItem(RUNLOG_KEY);
          const arr = raw ? JSON.parse(raw) : null;
          return Array.isArray(arr) ? arr : [];
        } catch (e) {
          return [];
        }
      }

      /* Cumulative achievement unlocks (cid-achievements), persisted across runs. */
      const ACH_KEY = "cid-achievements";
      function loadAchievements() {
        try {
          const raw = localStorage.getItem(ACH_KEY);
          const arr = raw ? JSON.parse(raw) : null;
          return Array.isArray(arr) ? arr : [];
        } catch (e) {
          return [];
        }
      }
      function saveAchievements(ids) {
        try {
          localStorage.setItem(ACH_KEY, JSON.stringify(ids));
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }

      /* Helpers ------------------------------------------------------------- */
      const $ = (id) => document.getElementById(id);
      const t = (pair) =>
        pair && pair[lang] != null ? pair[lang] : pair ? pair.en : "";

      function show(screenId) {
        ["screen-home", "screen-case", "screen-result", "screen-end"].forEach(
          (s) => {
            $(s).classList.toggle("hidden", s !== screenId);
          },
        );
      }

      function bandLabel(value) {
        const b =
          UI.band.find((x) => value <= x.max) || UI.band[UI.band.length - 1];
        return t(b.text);
      }

      function scoreTitle(total) {
        const band =
          UI.scoreTitle.find((x) => total >= x.min) ||
          UI.scoreTitle[UI.scoreTitle.length - 1];
        return t(band.text);
      }

      /* Static text that does not depend on the current screen's dynamic data. */
      function renderStatic() {
        document.documentElement.lang = lang;
        $("home-title").textContent = t(UI.homeTitle);
        $("home-tagline").textContent = t(UI.homeTagline);
        $("btn-start").textContent = t(UI.start);
        $("btn-submit").textContent = t(UI.submit);
        $("btn-next").textContent = t(UI.next);
        $("btn-home").textContent = t(UI.backHome);
        $("label-telemetry").textContent = t(UI.telemetry);
        $("label-question").textContent = t(UI.question);
        $("label-confidence").textContent = t(UI.confidence);
        document.querySelector(".meta-lang").textContent = t(UI.langLabel);
        $("lang-en").classList.toggle("active", lang === "en");
        $("lang-zh").classList.toggle("active", lang === "zh");

        // Continue button only appears when a resumable run is saved.
        const cont = $("btn-continue");
        cont.textContent = t(UI.continueWord);
        cont.classList.toggle("hidden", loadProgress() === null);
      }

      /* Re-render whichever screen is currently visible (for language toggle). */
      function rerenderCurrent() {
        renderStatic();
        if (!$("screen-case").classList.contains("hidden")) renderCase();
        if (!$("screen-result").classList.contains("hidden")) {
          /* result re-render */ renderResult(lastResult);
        }
        if (!$("screen-end").classList.contains("hidden")) renderEnd();
      }

      /* Case screen --------------------------------------------------------- */
      function renderCase() {
        const c = cases[caseIndex];
        $("case-meta").textContent =
          `${t(UI.caseWord)} #${String(caseIndex + 1).padStart(3, "0")}  ·  ${t(UI.difficulty)}: ${t(UI.diff[c.difficulty])}`;
        $("case-title").textContent = t(c.title);
        $("case-intro").textContent = t(c.intro);

        const tele = $("telemetry");
        tele.innerHTML = "";
        c.telemetry.forEach((row) => {
          const div = document.createElement("div");
          div.className = "tele-row";
          div.innerHTML =
            `<span class="tele-key">${t(row.key)}</span>` +
            `<span class="tele-val status-${row.status}">${t(row.value)}</span>`;
          tele.appendChild(div);
        });

        const list = $("choices");
        list.innerHTML = "";
        c.choices.forEach((ch) => {
          const li = document.createElement("li");
          li.className =
            "choice" + (selectedChoiceId === ch.id ? " selected" : "");
          li.innerHTML =
            `<label style="cursor:pointer;display:block;">` +
            `<input type="radio" name="choice" value="${ch.id}" ${selectedChoiceId === ch.id ? "checked" : ""}/>` +
            `${t(ch.label)}</label>`;
          li.querySelector("input").addEventListener("change", () => {
            selectedChoiceId = ch.id;
            $("btn-submit").disabled = false;
            [...list.children].forEach((x) => x.classList.remove("selected"));
            li.classList.add("selected");
          });
          list.appendChild(li);
        });

        const conf = $("confidence");
        $("confidence-val").textContent = conf.value + "%";
        $("confidence-label").textContent = bandLabel(Number(conf.value));
        $("btn-submit").disabled = selectedChoiceId === null;
      }

      /* Result screen ------------------------------------------------------- */
      let lastResult = null;
      /* Achievements unlocked for the first time on the run that just ended.
       * Computed once in nextCase() so language re-renders do not re-commit. */
      let lastFreshAchievements = [];

      function submitCase() {
        if (selectedChoiceId === null) return;
        const c = cases[caseIndex];
        const confidence = Number($("confidence").value);
        const isCorrect = c.answer !== "none" && selectedChoiceId === c.answer;
        const delta = isCorrect ? Math.round(50 + confidence / 2) : -confidence;
        totalScore += delta;

        lastResult = {
          caseIndex,
          selectedChoiceId,
          confidence,
          isCorrect,
          delta,
        };
        runLog.push({
          caseId: c.id,
          isCorrect,
          confidence,
          none: c.answer === "none",
        });
        saveProgress(caseIndex + 1, totalScore);
        renderResult(lastResult);
        show("screen-result");
      }

      function renderResult(r) {
        if (!r) return;
        const c = cases[r.caseIndex];
        const guess = c.choices.find((x) => x.id === r.selectedChoiceId);

        const verdict = $("verdict");
        verdict.textContent = r.isCorrect ? t(UI.correct) : t(UI.incorrect);
        verdict.className = "verdict " + (r.isCorrect ? "correct" : "wrong");

        const lines = $("result-lines");
        lines.innerHTML = "";
        const addLine = (s) => {
          const p = document.createElement("p");
          p.className = "result-line";
          p.textContent = s;
          lines.appendChild(p);
        };
        if (!r.isCorrect) {
          addLine(`${t(UI.yourGuess)}: ${guess ? t(guess.label) : "-"}`);
          addLine(`${t(UI.confidence)}: ${r.confidence}%`);
        }
        addLine(`${t(UI.actualCause)}: ${t(c.actualCause)}`);
        if (!r.isCorrect && r.confidence >= 90) addLine(t(UI.penalty));

        $("explanation").textContent = t(c.explanation);
        $("result-flavor").textContent = r.isCorrect
          ? t(c.resultFlavor.correct)
          : t(c.resultFlavor.wrong);

        const sign = r.delta >= 0 ? "+" : "";
        $("score-delta").textContent = `${t(UI.score)}: ${sign}${r.delta}`;
        $("total-score").textContent = `${t(UI.total)}: ${totalScore}`;
      }

      /* End-of-run screen --------------------------------------------------- */
      /* Compute the run's summary stats from runLog. Ghost / "none" cases are
       * unscorable and excluded from accuracy. */
      function fyStats() {
        const scoredEntries = runLog.filter((e) => !e.none);
        const scored = scoredEntries.length;
        const solved = scoredEntries.filter((e) => e.isCorrect).length;
        const overconfident = runLog.filter(
          (e) => !e.isCorrect && e.confidence >= 90,
        ).length;
        const avgConfidence = runLog.length
          ? Math.round(
              runLog.reduce((a, e) => a + e.confidence, 0) / runLog.length,
            )
          : 0;
        return {
          answered: runLog.length,
          scored,
          solved,
          overconfident,
          avgConfidence,
          accuracy: scored ? solved / scored : 0,
        };
      }

      function reviewVerdict(stats) {
        const v =
          REVIEW_VERDICTS.find((x) => x.cond(stats)) ||
          REVIEW_VERDICTS[REVIEW_VERDICTS.length - 1];
        return t(v.text);
      }

      /* Evaluate achievements for the finished run, merge with stored unlocks,
       * and return the ids unlocked for the first time this run. */
      function commitAchievements(stats) {
        const byId = {};
        cases.forEach((c) => {
          byId[c.id] = c;
        });
        const ctx = { stats, log: runLog, byId };
        const earned = ACHIEVEMENTS.filter((a) => {
          try {
            return a.cond(ctx);
          } catch (e) {
            return false;
          }
        }).map((a) => a.id);

        const stored = loadAchievements();
        const fresh = earned.filter((id) => !stored.includes(id));
        if (fresh.length) saveAchievements([...stored, ...fresh]);
        return fresh;
      }

      function renderFyReview(stats) {
        const box = $("fy-review");
        const pct = (n) => `${Math.round(n * 100)}%`;
        const row = (key, val) =>
          `<div class="fy-stat"><span class="fy-key">${key}</span>` +
          `<span class="fy-val">${val}</span></div>`;
        box.innerHTML =
          `<h2>${t(UI.reviewTitle)}</h2>` +
          row(t(UI.statSolved), `${stats.solved} / ${stats.scored}`) +
          row(t(UI.statAccuracy), pct(stats.accuracy)) +
          row(t(UI.statOverconfident), String(stats.overconfident)) +
          row(t(UI.statAvgConfidence), `${stats.avgConfidence}%`) +
          `<p class="fy-verdict">${reviewVerdict(stats)}</p>`;
      }

      function renderAchievements(freshIds) {
        const box = $("achievements-block");
        const unlocked = loadAchievements();
        const fresh = new Set(freshIds);
        // Show newly-unlocked first, then any other already-unlocked ones.
        const shown = ACHIEVEMENTS.filter((a) => unlocked.includes(a.id)).sort(
          (a, b) => (fresh.has(b.id) ? 1 : 0) - (fresh.has(a.id) ? 1 : 0),
        );
        const items = shown
          .map((a) => {
            const isNew = fresh.has(a.id);
            return (
              `<div class="ach-item">` +
              `<div class="ach-name">${isNew ? "\u2728 " : ""}${t(a.name)}</div>` +
              `<div class="ach-desc">${t(a.desc)}</div></div>`
            );
          })
          .join("");
        const sub = freshIds.length
          ? `${t(UI.achNew)}: ${freshIds.length}`
          : t(UI.achNone);
        box.innerHTML =
          `<h2>${t(UI.achievementsTitle)}</h2>` +
          `<p class="ach-sub">${sub} \u00b7 ${t(UI.achProgress)}: ${unlocked.length} / ${ACHIEVEMENTS.length}</p>` +
          items;
      }

      function renderEnd() {
        $("end-title").textContent = t(UI.endTitle);
        $("end-flavor").textContent = scoreTitle(totalScore);
        $("end-score").textContent =
          `${t(UI.total)}: ${totalScore} / ${cases.length * 100}`;
        $("btn-share").textContent = t(UI.share);
        $("share-feedback").textContent = "";

        const stats = fyStats();
        renderFyReview(stats);
        renderAchievements(lastFreshAchievements);
      }

      function shareText() {
        return [
          t(UI.homeTitle),
          `${t(UI.total)}: ${totalScore} / ${cases.length * 100} · ${scoreTitle(totalScore)}`,
          t(UI.shareLine),
          "https://sayaka-4987.github.io/Core-Identity-Detective/",
        ].join("\n");
      }

      async function shareResult() {
        const text = shareText();
        try {
          await navigator.clipboard.writeText(text);
          $("share-feedback").textContent = t(UI.shareCopied);
        } catch (e) {
          $("share-feedback").textContent = t(UI.shareFailed);
        }
      }

      /* Navigation ---------------------------------------------------------- */
      function startRun() {
        clearProgress();
        caseIndex = 0;
        totalScore = 0;
        selectedChoiceId = null;
        runLog = [];
        $("confidence").value = 50;
        renderCase();
        show("screen-case");
      }

      function resumeRun() {
        const saved = loadProgress();
        if (!saved) {
          startRun();
          return;
        }
        caseIndex = saved.progress;
        totalScore = saved.total;
        selectedChoiceId = null;
        runLog = loadRunLog();
        $("confidence").value = 50;
        renderCase();
        show("screen-case");
      }

      function nextCase() {
        caseIndex += 1;
        if (caseIndex >= cases.length) {
          clearProgress();
          lastFreshAchievements = commitAchievements(fyStats());
          renderEnd();
          show("screen-end");
          return;
        }
        selectedChoiceId = null;
        $("confidence").value = 50;
        renderCase();
        show("screen-case");
      }

      /* Wiring -------------------------------------------------------------- */
      $("lang-en").addEventListener("click", () => {
        lang = "en";
        saveLang(lang);
        rerenderCurrent();
      });
      $("lang-zh").addEventListener("click", () => {
        lang = "zh";
        saveLang(lang);
        rerenderCurrent();
      });
      $("btn-start").addEventListener("click", startRun);
      $("btn-continue").addEventListener("click", resumeRun);
      $("btn-submit").addEventListener("click", submitCase);
      $("btn-next").addEventListener("click", nextCase);
      $("btn-home").addEventListener("click", () => {
        renderStatic();
        show("screen-home");
      });
      $("btn-share").addEventListener("click", shareResult);
      $("confidence").addEventListener("input", () => {
        $("confidence-val").textContent = $("confidence").value + "%";
        $("confidence-label").textContent = bandLabel(
          Number($("confidence").value),
        );
      });

      renderStatic();
      show("screen-home");
    </script>
  </body>
</html>
